<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WA検定</title>
  <meta name="description" content="オンラインコミュニティWAの４択クイズ">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">

  <!-- リンクをシェアしたときのサムネイル（OGP）
       ※ 公開URLを変えたときは、下の https://lachimym.github.io/waquiz/ を書き換えてください。
          画像は絶対URLで指定する必要があります（相対パスだと出ないSNSがあります）。 -->
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="WA検定">
  <meta property="og:title"       content="WA検定">
  <meta property="og:description" content="オンラインコミュニティWAの４択クイズ">
  <meta property="og:url"         content="https://lachimym.github.io/waquiz/">
  <meta property="og:image"       content="https://lachimym.github.io/waquiz/assets/ogp.png">
  <meta property="og:image:width"  content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt"   content="WA検定">
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="WA検定">
  <meta name="twitter:description" content="オンラインコミュニティWAの４択クイズ">
  <meta name="twitter:image"       content="https://lachimym.github.io/waquiz/assets/ogp.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Karla:wght@400;500;700&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
  <!-- ?v= はブラウザのキャッシュ対策。中身を更新したら、この数字も必ず変えること。 -->
  <link rel="stylesheet" href="css/style.css?v=20260824-c">
</head>
<body>
  <header id="header" class="header"></header>
  <div id="notice"></div>
  <main id="app" class="app"></main>

  <!-- モーダル・トースト -->
  <div id="modal" class="modal"></div>
  <div id="toasts" class="toasts"></div>

  <footer class="site-foot">
    <span class="site-foot-tag">オンラインコミュニティWAの４択クイズ</span>
    <span id="footer-pool" class="site-foot-pool"></span>
  </footer>

  <!-- ハンバーガーメニュー -->
  <div id="menu" class="menu"></div>

  <!-- 設定 → Supabase SDK → 各モジュール の順で読み込む -->
  <script src="js/config.js?v=20260824-c"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/icons.js?v=20260824-c"></script>
  <script src="js/misskey.js?v=20260824-c"></script>
  <script src="js/store.js?v=20260824-c"></script>
  <script src="js/app.js?v=20260824-c"></script>
</body>
</html>
